@import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;700&family=Roboto+Mono:wght@400;500;700&display=swap');

.pcp * { box-sizing: border-box; }
.pcp {
  background: ${Y.paper};
  color: ${Y.ink};
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100%;
  padding: calc(18px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
  -webkit-font-smoothing: antialiased;
}
.sheet { max-width: 1120px; margin: 0 auto; background: ${Y.paper}; border: 1px solid ${Y.ink}; box-shadow: 3px 3px 0 rgba(20,24,26,.18); }
.cond { font-family: "Roboto Condensed", "Arial Narrow", Arial, sans-serif; }
.mono { font-family: "Roboto Mono", ui-monospace, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

.hdr { border-bottom: 1px solid ${Y.ink}; padding: 12px 16px 10px; background: ${Y.band}; }
.hdr-t { font-size: 19px; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
.hdr-s { font-size: 11px; letter-spacing: .09em; color: ${Y.inkSoft}; text-transform: uppercase; margin-top: 3px; }

/* ---- top input bar ---- */
.bar { border-bottom: 1px solid ${Y.ink}; padding: 13px 16px 14px; display: grid; gap: 14px 18px; grid-template-columns: repeat(3, 1fr); }
@media (max-width: 760px) { .bar { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 460px) { .bar { grid-template-columns: 1fr; } }
.span2 { grid-column: span 2; }
@media (max-width: 460px) { .span2 { grid-column: span 1; } }

.fl { font-size: 10px; letter-spacing: .11em; text-transform: uppercase; color: ${Y.inkSoft}; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
.fw { display: flex; align-items: center; background: ${Y.well}; border: 1px solid ${Y.rule}; border-radius: 1px; padding: 6px 8px; }
.fw:focus-within { border-color: ${Y.ink}; box-shadow: 0 0 0 2px rgba(30,74,110,.25); }
.fw input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: ${Y.ink}; font-size: 16px; font-weight: 500; font-family: "Roboto Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }
.fx { color: ${Y.inkSoft}; font-size: 12px; }
.hint { font-size: 10.5px; color: ${Y.inkSoft}; margin-top: 4px; line-height: 1.45; }
input[type=range] { width: 100%; accent-color: ${Y.stamp}; margin: 7px 0 0; height: 18px; }

.chips { display: flex; gap: 5px; flex-wrap: wrap; }
.chip { font-family: "Roboto Condensed", Arial, sans-serif; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; padding: 6px 9px; border: 1px solid ${Y.rule}; background: ${Y.well}; color: ${Y.inkSoft}; cursor: pointer; border-radius: 1px; }
.chip:hover { border-color: ${Y.ink}; color: ${Y.ink}; }
.chip.on { background: ${Y.ink}; border-color: ${Y.ink}; color: ${Y.paper}; font-weight: 700; }

/* ---- headline ---- */
.quote { padding: 15px 16px 14px; border-bottom: 1px solid ${Y.ink}; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.stamp { border: 2px solid ${Y.stamp}; box-shadow: inset 0 0 0 2px ${Y.paper}, inset 0 0 0 3px ${Y.stamp}; padding: 9px 16px 7px; transform: rotate(-2.4deg); color: ${Y.stamp}; text-align: center; flex: 0 0 auto; }
.stamp-l { font-family: "Roboto Condensed", Arial, sans-serif; font-size: 10px; letter-spacing: .2em; font-weight: 700; }
.stamp-f { font-family: "Roboto Mono", monospace; font-size: 38px; font-weight: 700; line-height: 1.05; letter-spacing: -.02em; }
.stamp-s { font-family: "Roboto Condensed", Arial, sans-serif; font-size: 10px; letter-spacing: .14em; }
@media (max-width: 520px) { .stamp-f { font-size: 31px; } }

.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(124px, 1fr)); gap: 12px 18px; flex: 1 1 280px; }
.kv-l { font-size: 9.5px; letter-spacing: .11em; text-transform: uppercase; color: ${Y.inkSoft}; }
.kv-v { font-family: "Roboto Mono", monospace; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kv-n { font-size: 10px; color: ${Y.inkSoft}; }

/* ---- tabs ---- */
.tabs { display: flex; border-bottom: 1px solid ${Y.ink}; background: ${Y.band}; overflow-x: auto; }
.tab { font-family: "Roboto Condensed", Arial, sans-serif; font-size: 12px; letter-spacing: .13em; text-transform: uppercase; padding: 9px 14px; background: transparent; border: none; border-right: 1px solid ${Y.rule}; color: ${Y.inkSoft}; cursor: pointer; white-space: nowrap; }
.tab:hover { color: ${Y.ink}; }
.tab.on { background: ${Y.paper}; color: ${Y.ink}; font-weight: 700; box-shadow: inset 0 -3px 0 ${Y.stamp}; }

.pane { padding: 14px 16px 18px; }
.pane-h { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; margin-bottom: 3px; }
.pane-s { font-size: 12.5px; color: ${Y.inkSoft}; margin-bottom: 13px; line-height: 1.55; max-width: 70ch; }

/* ---- tables ---- */
.tblwrap { overflow-x: auto; border: 1px solid ${Y.rule}; background: ${Y.well}; }
table.t { border-collapse: collapse; width: 100%; font-family: "Roboto Mono", monospace; font-size: 12.5px; font-variant-numeric: tabular-nums; }
table.t th { font-family: "Roboto Condensed", Arial, sans-serif; font-size: 10px; letter-spacing: .09em; text-transform: uppercase; text-align: right; padding: 7px 10px; color: ${Y.preprint}; border-bottom: 1px solid ${Y.ink}; white-space: nowrap; font-weight: 700; }
table.t th:first-child, table.t td:first-child { text-align: left; }
table.t td { padding: 6px 10px; text-align: right; border-bottom: 1px solid rgba(166,177,181,.55); white-space: nowrap; }
table.t tr:last-child td { border-bottom: none; }
table.t tr.here td { background: rgba(179,47,39,.09); font-weight: 700; }
table.t tr.here td:first-child::before { content: "\\25B8 "; color: ${Y.stamp}; }
.best { color: ${Y.stamp}; font-weight: 700; }
.save { color: ${Y.preprint}; }
.cost { color: ${Y.stamp}; }

.levers { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 860px) { .levers { grid-template-columns: 1fr; } }
.lv-h { font-family: "Roboto Condensed", Arial, sans-serif; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
.lv-h span { color: ${Y.inkSoft}; font-weight: 400; letter-spacing: .04em; text-transform: none; }

/* ---- the grid (signature) ---- */
.gwrap { overflow-x: auto; border: 1px solid ${Y.ink}; background: ${Y.well}; }
table.g { border-collapse: collapse; width: 100%; font-family: "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }
table.g th { font-family: "Roboto Condensed", Arial, sans-serif; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: ${Y.preprint}; font-weight: 700; padding: 7px 8px; border-bottom: 1px solid ${Y.ink}; border-right: 1px solid ${Y.rule}; white-space: nowrap; }
table.g th.rh { text-align: left; border-right: 1px solid ${Y.ink}; border-bottom: 1px solid rgba(166,177,181,.55); font-size: 11px; color: ${Y.ink}; }
table.g th.rh small { display: block; color: ${Y.inkSoft}; font-weight: 400; letter-spacing: .04em; }
table.g th.corner { border-right: 1px solid ${Y.ink}; text-align: left; }
table.g td { padding: 7px 6px; text-align: center; border-right: 1px solid rgba(166,177,181,.45); border-bottom: 1px solid rgba(166,177,181,.45); min-width: 86px; }
.gc-v { font-size: 12.5px; font-weight: 500; }
.gc-d { font-family: "Roboto Condensed", Arial, sans-serif; font-size: 9.5px; letter-spacing: .07em; color: ${Y.inkSoft}; margin-top: 2px; text-transform: uppercase; }
.gc-best { outline: 2px solid ${Y.preprint}; outline-offset: -2px; }
.gc-best .gc-d { color: ${Y.preprint}; font-weight: 700; }
.gc-you { outline: 2px solid ${Y.ink}; outline-offset: -2px; }
.gc-you .gc-v::after { content: " \\25C2"; color: ${Y.ink}; }

.note { border-left: 3px solid ${Y.stamp}; background: rgba(179,47,39,.06); padding: 10px 12px; font-size: 12.5px; line-height: 1.6; margin-top: 14px; }
.warn { border-left: 3px solid ${Y.preprint}; background: rgba(30,74,110,.08); padding: 10px 12px; font-size: 12.5px; line-height: 1.5; margin-bottom: 12px; }
.fine { font-size: 10.5px; color: ${Y.inkSoft}; line-height: 1.6; padding: 12px 16px; border-top: 1px solid ${Y.ink}; background: ${Y.band}; }
.rule { height: 0; border-top: 1px dashed ${Y.rule}; margin: 16px 0; }
.btn { font-family: "Roboto Condensed", Arial, sans-serif; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding: 6px 11px; border: 1px solid ${Y.ink}; background: ${Y.well}; color: ${Y.ink}; cursor: pointer; border-radius: 1px; }
.btn:hover { background: ${Y.ink}; color: ${Y.paper}; }
.btn.gh { border-color: ${Y.rule}; color: ${Y.inkSoft}; }
.setgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 4px 20px; }
.setgrp { font-family: "Roboto Condensed", Arial, sans-serif; font-size: 11px; letter-spacing: .15em; text-transform: uppercase; font-weight: 700; color: ${Y.stamp}; margin: 4px 0 8px; }
.fld { margin-bottom: 13px; }
button:focus-visible, input:focus-visible { outline: 2px solid ${Y.preprint}; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
